# build-spatia-image.yml — added 2026-09-25 for the Cirro/Summit deadline push.
#
# Builds Dockerfile.spacec-base (SPATIA layered on top of Dylan's spacec
# container, ghcr.io/break-through-cancer/btc-spatial-proteomics/spacec)
# and pushes the result to ghcr.io under THIS repo -- no AWS credentials
# needed for this step. Manual trigger only (workflow_dispatch), on
# purpose: Dockerfile.spacec-base has never been built anywhere, so the
# first run is a real test, not something to fire automatically on every
# push yet. Once it builds clean, flip to push-triggered if you want.
#
# Still open after this: whether Cirro's AWS Batch compute environment can
# pull from ghcr.io directly, or needs the image re-pushed to ECR instead
# -- that's a question for Dima/BTC, not something this workflow resolves.

name: Build SPATIA Cirro image

on:
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.spacec-base
          push: true
          tags: |
            ghcr.io/afroozjahedi/spatia-pipeline:${{ github.sha }}
            ghcr.io/afroozjahedi/spatia-pipeline:latest
