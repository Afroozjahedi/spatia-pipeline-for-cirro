# ============================================================
# GBM CyCIF Cell Type Definitions — patient BTC_988, section C3
# Panel: HSV1, GZMB (GranzymeB), CD20 (+ DNA1/"DAPI" for segmentation only,
# not a typing marker).
#
# Judgment call (flagged, not hidden — confidence ~80% this ordering is
# reasonable, not verified against ground truth): priority order below is
# HSV1+ > GranzymeB+ > CD20+ > Other, with explicit exclusions so a cell
# positive for multiple markers gets exactly one label instead of silently
# defaulting to dict order. HSV1+ is prioritized because it's the anchor
# cell type for the triad (infected cell x effector x B cell).
# ============================================================

cell_type_definitions:

  HSV1+ cells:
    - required: [HSV1_pos]

  GranzymeB+ effector cells:
    - required: [GZMB_pos]
      excluded: [HSV1_pos]

  CD20+ B cells:
    - required: [CD20_pos]
      excluded: [HSV1_pos, GZMB_pos]

  # Catch-all -- assigned last only if nothing else matched
  Other cells:
    - required: []
      excluded: []
