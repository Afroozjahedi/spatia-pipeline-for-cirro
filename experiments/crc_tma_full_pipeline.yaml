# ============================================================
# SPATIA Pipeline Configuration — CRC TMA, FULL PIPELINE (raw image -> triads)
#
# Companion to experiments/crc_tma.yaml, which deliberately starts at triads
# using the hackathon's already-segmented, already-cell-typed CSV. THIS config
# is for demonstrating the new upstream steps end-to-end against the raw CRC
# TMA core images (OneDrive Hackathon/TMA_A, TMA_B, DII_TMA_A, DII_TMA_B).
#
# HONEST STATUS (see SPATIA_PIPELINE_LOG.md for the full write-up):
#   - tif_conversion / roi_masking / segmentation modules are written and,
#     for tif_conversion + roi_masking, smoke-tested end-to-end against a
#     synthetic 92-channel image built from the REAL channelNames.txt panel.
#   - segmentation.py's CSV-export logic (the part downstream code depends
#     on) is verified against a synthetic segmentation mask. The actual
#     spacec/Mesmer call itself is NOT verified -- spacec could not be
#     installed in the build sandbox (pulls torch, ~900MB, exhausted disk).
#   - NOT run against real CRC pixels: the sandbox used to build this could
#     not fetch .tif files from OneDrive at all (tool limitation, confirmed
#     on files from 3.6MB to 508MB). Real validation needs to happen where
#     the raw cores are actually reachable (local machine / Seadragon).
#   - Nuance worth flagging: the raw per-core files already in OneDrive
#     (e.g. TMA_A/reg011_X01_Y01_Z09.tif) appear to be POST-core-extraction
#     already (each is a single ~1920x1440x92ch core, not a whole-TMA-slide
#     grid) -- so for THIS historical dataset, tif_conversion and
#     roi_masking may have little or nothing to do (files are already plain
#     .tif, already per-core). segmentation is the step that would actually
#     need to run to reproduce data/crc_tma/matched_cells/*.csv from raw
#     pixels. Treat raw_image_dir below as segmentation's direct input for
#     this dataset specifically, not assumed to need tif_conversion/roi_masking
#     first -- confirm with Afrouz before assuming otherwise.
#
# Run with:
#   python run_pipeline.py --config experiments/crc_tma_full_pipeline.yaml \
#       --steps segmentation preprocessing
# ============================================================

experiment:
  name: "CRC_TMA_full"
  description: "CRC TMA — full pipeline demo from raw core images through triads"
  groups: ["CLR", "DII"]
  # Keyed by slide_folder (immediate parent dir of each raw core .tif) --
  # raw filenames like "reg011_X01_Y01_Z09.tif" carry no CLR/DII marker at
  # all, only the folder does. See resolve_experiment_group() in
  # spatia/analysis/preprocessing.py (added 2026-08-28) for the lookup that
  # reads this. TMA_A/TMA_B are replicate scans of the same CLR cores;
  # DII_TMA_A/DII_TMA_B are replicate scans of the same DII cores.
  image_experiment_group_map:
    TMA_A: "CLR"
    TMA_B: "CLR"
    DII_TMA_A: "DII"
    DII_TMA_B: "DII"

imaging:
  microns_per_pixel: 0.65
  experiment_group_areas_um2:
    CLR: 79432704.0
    DII: 84105216.0

paths:
  # UPDATED 2026-08-28: raw data moved off OneDrive onto Seadragon (rsrch6).
  # Inferred from the SMB path Afrouz gave for DII_TMA_A:
  #   smb://d1prprsh6ccifs/home/trans_mol_path/ajahedi/SPATIA pipeline paper/data/DII_TMA_A
  # -> mapped to the native Linux mount used everywhere else in this project
  #    (matches /rsrch6/home/trans_mol_path/ajahedi/... in SPATIA_PIPELINE_LOG.md
  #    and the triad-analysis project's own cluster paths).
  # CONFIDENCE: high that the /rsrch6 prefix + rest-of-path mapping is right
  # (exact account/lab path match), NOT verified with an actual `ls` on
  # JupyterHub yet -- do that before running. Also NOT yet confirmed that
  # TMA_A / TMA_B / DII_TMA_B sit as siblings of DII_TMA_A under the same
  # data/ parent (assumed here since crc_tma_full_pipeline.yaml's own
  # original description names all four together) -- worth a quick `ls`
  # of the parent to confirm all four are actually there before running.

  # Not read by segmentation.py directly (masked_roi_dir below is the real
  # input) -- kept here for documentation of where the raw data lives.
  raw_image_dir: "/rsrch6/home/trans_mol_path/ajahedi/SPATIA pipeline paper/data"

  # If tif_conversion IS needed: standard-TIFF output goes here.
  converted_tif_dir: "data/crc_tma_full/converted_tif"

  # QuPath ROI/TMA export. For this dataset, cores already appear pre-extracted
  # (see status note) -- qupath_roi_dir may end up unused if roi_masking is
  # skipped in favor of segmentation reading raw_image_dir directly.
  qupath_roi_dir: "data/crc_tma_full/qupath_roi"

  # THE real segmentation input (segmentation.py reads paths.masked_roi_dir,
  # not raw_image_dir -- see 2026-08-27 finding). Points at the SAME parent
  # as raw_image_dir above: segmentation.py walks this recursively and picks
  # up TMA_A/, TMA_B/, DII_TMA_A/, DII_TMA_B/ as separate "slides" (their
  # folder name becomes the slide_id) -- no roi_masking step needed since
  # these cores are already pre-extracted (see status note at top of file).
  masked_roi_dir: "/rsrch6/home/trans_mol_path/ajahedi/SPATIA pipeline paper/data"

  # Real 92-channel CRC panel -- written 2026-08-28 from Afrouz's own channel
  # list (spacec/QuPath scanner metadata), NOT reconstructed or guessed.
  # Repo-relative: resolves correctly once this repo is on Seadragon and
  # run_pipeline.py is run from the repo root.
  channel_file: "data/crc_tma_full/channelNames.txt"

  # Segmentation writes here; preprocessing reads from here -- same directory,
  # no separate wiring needed. Moved to scratch (not home) to match this
  # project's existing convention for pipeline outputs (see crc_tma.yaml's
  # commented Seadragon path).
  segmentation_results_dir: "/rsrch6/scratch/trans_mol_path/ajahedi/CRC_TMA_full/segmentation_results"
  input_dir: "/rsrch6/scratch/trans_mol_path/ajahedi/CRC_TMA_full/segmentation_results"
  output_dir: "/rsrch6/scratch/trans_mol_path/ajahedi/CRC_TMA_full/results"

tif_conversion:
  enabled: false   # see status note -- likely a no-op for this dataset's pre-extracted cores
  image_format: ".qptiff"
  preserve_metadata: true

roi_masking:
  enabled: false   # see status note -- cores already appear pre-extracted

segmentation:
  enabled: true
  seg_method: "mesmer"
  nuclei_channel: "HOECHST1"   # fixed 2026-08-28: real panel has no "DAPI" channel -- CyCIF nuclear stain is HOECHST, cycled every 4 channels (HOECHST1..23). Using cycle-1 (freshest signal, pre-bleach) as the segmentation nuclear channel.
  membrane_channel_list: ["CD45 - hematopoietic cells"]
  compartment: "whole-cell"
  input_format: "Multichannel"
  resize_factor: 1
  size_cutoff: 0
  generate_overlays: true

preprocessing:
  last_marker: "DRAQ5"   # last channel in the real 92-channel panel (channelNames.txt)
  qc_filter:
    size_percentile: 1
    dapi_percentile: 1
  noise:
    cut_off: 0.01
    count_bin: 50

cell_typing:
  mode: "automatic"
  input_file: ""
  analysis_name: "CRC_TMA_full"
  markers:
    # TODO-was: "fill in from channelNames.txt once segmentation output is
    # validated". This sandbox still cannot reach
    # OneDrive/Hackathon/channelNames.txt directly (confirmed again on
    # 2026-07-22 -- outside this session's connected folders). However the
    # SAME underlying CRC dataset's short marker names are already known
    # and pipeline-verified via the pre-segmented-CSV route: this is the
    # exact 50-name panel from experiments/crc_tma_celltyping.yaml /
    # prepare_crc_for_celltyping.py's MARKER_RENAME dict, which already ran
    # successfully (see crc_accuracy_report.csv, crc_confusion_matrix.png,
    # dated 2026-07-01). Copied here as a reuse of an already-established
    # name list, not a new marker-selection decision -- flag to Afrouz:
    # please confirm this 50-marker list is complete/correct for the raw
    # 92-channel image too (92 raw channels include blanks/DAPI-per-cycle
    # not present as named markers here).
    panel:
      - CD45
      - CD44
      - FOXP3
      - CDX2
      - CD8
      - p53
      - GATA3
      - Tbet
      - betacatenin
      - HLA_DR
      - PDL1
      - Ki67
      - CD45RA
      - CD4
      - CD21
      - MUC1
      - CD30
      - CD2
      - Vimentin
      - CD20
      - LAG3
      - CD5
      - IDO1
      - CK
      - CD11b
      - CD56
      - aSMA
      - BCL2
      - CD25
      - CollagenIV
      - CD11c
      - PD1
      - GzmB
      - EGFR
      - VISTA
      - CD15
      - CCR4
      - ICOS
      - MMP9
      - Synaptophysin
      - CD71
      - GFAP
      - CD7
      - CD3
      - ChromoA
      - CD163
      - CD57
      - CD45RO
      - CD68
      - CD31
      - Podoplanin
      - CD34
      - CD38
      - CD138
      - MMP12
    gating_only: []
  gmm:
    n_components: 2
    random_state: 42
    # NOT copied from crc_tma_celltyping.yaml (which uses 2.0 here, plus a
    # non-empty per_marker_overrides block and a cell_type_definitions_file).
    # Those are threshold/gating judgment calls on top of the marker list,
    # not a name-reuse -- left as this file's original placeholder values
    # and surfaced as an open decision (Q-FullPipeline-GMMThresholds) rather
    # than silently copied.
    cd45_std_multiplier: 3.0
    default_std_multiplier: 2.0
    per_marker_overrides: {}
  clustering:
    n_neighbors: 15
    leiden_resolution: 0.5
  cell_type_definitions_file: ""   # open -- see Q-FullPipeline-GMMThresholds below
  cluster_labels_file: null

analysis:
  triad:
    enabled: false   # turn on once segmentation + cell_typing are validated against
                      # the existing data/crc_tma/matched_cells/ ground truth
  tls:
    enabled: false
