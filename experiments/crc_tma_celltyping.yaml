# ============================================================
# SPATIA Pipeline — CRC TMA Automatic Cell Typing Validation
#
# Purpose: run GMM-based automatic cell typing on 258K CRC
# cells and compare to expert-assigned ClusterName labels.
#
# Prerequisites:
#   1. python prepare_crc_for_celltyping.py
#
# Run with:
#   python run_pipeline.py \
#       --config experiments/crc_tma_celltyping.yaml \
#       --steps cell_typing
#
# After run:
#   python compare_expert_vs_auto.py
# ============================================================

experiment:
  name: "CRC_TMA_CellTyping"
  description: "Automatic GMM cell typing on CRC TMA — validated against expert ClusterName labels"
  groups: ["CLR", "DII"]
  image_experiment_group_map: {}

imaging:
  microns_per_pixel: 0.65
  experiment_group_areas_um2:
    CLR: 79432704.0
    DII: 84105216.0

paths:
  segmentation_results_dir: ""
  input_dir:  "data/crc_tma_celltyping"
  output_dir: "data/crc_tma_celltyping/results"

# ── Preprocessing (skipped — h5ad built by prepare_crc_for_celltyping.py) ──
preprocessing:
  last_marker: null
  qc_filter:
    size_percentile: 1
    dapi_percentile: 1
  noise:
    cut_off: 0.01
    count_bin: 50

# ── Cell typing ──────────────────────────────────────────────
cell_typing:
  mode: "automatic"

  # h5ad produced by prepare_crc_for_celltyping.py
  input_file: "data/crc_tma_celltyping/crc_tma_for_celltyping.h5ad"

  analysis_name: "CRC_TMA_CT"

  markers:
    # All markers fed to GMM for positivity thresholding.
    # CD45 is included here (not in gating_only) so CD45_pos is computed
    # as a regular column. CD45 gating is skipped via skip_cd45_gate below
    # because we want to type BOTH immune and non-immune cells.
    panel:
      - CD45
      - CD44
      - FOXP3
      - CDX2
      - CD8
      - p53
      - GATA3
      - Tbet
      - betacatenin
      - HLA_DR
      - PDL1
      - Ki67
      - CD45RA
      - CD4
      - CD21
      - MUC1
      - CD30
      - CD2
      - Vimentin
      - CD20
      - LAG3
      - CD5
      - IDO1
      - CK
      - CD11b
      - CD56
      - aSMA
      - BCL2
      - CD25
      - CollagenIV
      - CD11c
      - PD1
      - GzmB
      - EGFR
      - VISTA
      - CD15
      - CCR4
      - ICOS
      - MMP9
      - Synaptophysin
      - CD71
      - GFAP
      - CD7
      - CD3
      - ChromoA
      - CD163
      - CD57
      - CD45RO
      - CD68
      - CD31
      - Podoplanin
      - CD34
      - CD38
      - CD138
      - MMP12
    # Empty — no CD45 gating (see skip_cd45_gate below)
    gating_only: []

  gmm:
    n_components: 2
    random_state: 42
    # skip_cd45_gate: true → run on ALL 258K cells (immune + tumor + stromal).
    # Required so:
    #   (a) CD45_pos is computed on the full population (not just CD45+ cells)
    #   (b) CK/CD31/aSMA thresholds are computed on the full mixed population
    #       (not near-zero on immune-only subset)
    skip_cd45_gate: true
    cd45_std_multiplier: 2.0   # used for CD45_pos threshold (liberal)
    # Standard threshold for panel markers
    default_std_multiplier: 2.0
    # Tighter gates for markers prone to bleed-through
    per_marker_overrides:
      CD45: 2.0     # permissive — capture all immune cells
      CD11c: 1.5    # DCs are rare — liberal gate
      HLA_DR: 1.5   # broadly expressed at low levels
      Vimentin: 1.5  # stromal bleed-through
      GzmB: 2.0

    # Q16 fix, decided by Afrouz 2026-08-18. Both transforms tested against
    # real CRC data and reverted — arcsinh(cofactor=5): 19.0% -> 10.8%;
    # log1p: 19.0% -> 8.9% (worse than arcsinh). Root cause (verified via
    # direct GMM inspection, not inference): ANY exact-zero point mass, even
    # a small one (e.g. CD3 at only 9.4% zero), gives the 2-component GMM an
    # easy near-infinite-likelihood fit where one component collapses onto
    # exactly that repeated value (mean~0, std~0.001) regardless of
    # transform, rather than splitting the real noise/positive populations
    # as intended. This is the classic GMM singular-covariance pathology,
    # not a dynamic-range/scale problem — so no monotonic transform (log,
    # arcsinh, or otherwise) fixes it on its own. Reverted to "none" (the
    # validated 19.0%-accuracy baseline) — the next candidate remediation
    # named here (fit GMM on non-zero values only, classify exact zeros as
    # negative by construction) is now IMPLEMENTED (2026-08-19) in
    # spatia/analysis/cell_typing.py's _fit_gmm(): whenever transform !=
    # "none", exact-zero raw values are excluded from the GMM fit before
    # transforming, specifically to fix this collapse. Verified on a
    # synthetic 33%-zero-inflated marker: without the fix, "yeojohnson"
    # scored 52.6% agreement with ground truth (worse than "none"'s
    # 97.2%, consistent with the arcsinh/log1p regression documented
    # above); with the fix, "yeojohnson" scored 98.8%. Still left as
    # "none" here rather than auto-flipped, since re-validating against
    # real CRC data (not synthetic) via compare_expert_vs_auto.py is the
    # right next step before trusting a new number for the paper — try
    # "arcsinh" or "yeojohnson" now that the root cause has a real fix.
    transform: "none"
    arcsinh_cofactor: 5.0

    # per_marker_transform_overrides (added 2026-09-11): the 15 markers
    # documented above 30% exact-zero intensity get "arcsinh" here while
    # the rest of the panel stays at the global "none" default — isolating
    # the transform fix to just the markers it's meant for, instead of the
    # blanket arcsinh sweep from 2026-08-18 that regressed accuracy (that
    # earlier test applied arcsinh to ALL markers at once, including ones
    # that didn't need it, and ran before two later fixes: the 2026-08-19
    # exact-zero exclusion in _fit_gmm, and the 2026-09-11 generalization
    # of that exclusion from a literal `== 0` check to _detect_point_mass()
    # -- see that function's docstring for why the literal check matters:
    # it only finds the right point mass on raw, un-normalized data).
    # List derived from a standalone marker_shape_diagnosis.py run against
    # this exact h5ad (zero_frac >= 0.30, matching the "14/53" figure
    # already documented above): GzmB, CD20, CK, CD15, ChromoA, CD138,
    # MMP9, CD31, CD7, HLA_DR, MUC1, NaKATPase, CollagenIV, Synaptophysin,
    # CD45. CD15 (granulocytes) and CD45 (used in most other cell-type
    # rules) are the two highest-leverage markers on this list.
    #
    # NOTE: NaKATPase is NOT listed below even though the diagnosis flagged
    # it (zero_frac=0.366) -- it's present in the h5ad (56 marker columns,
    # per the real run's "Loaded 258,385 cells x 56 markers" log line) but
    # is NOT in the `markers.panel` list above (55 markers), so it's
    # already excluded from cell typing entirely regardless of transform.
    # An override for it here would be a silent no-op. Worth a quick check
    # with Afrouz on whether that panel exclusion was deliberate.
    per_marker_transform_overrides:
      GzmB: "arcsinh"
      CD20: "arcsinh"
      CK: "arcsinh"
      CD15: "arcsinh"
      ChromoA: "arcsinh"
      CD138: "arcsinh"
      MMP9: "arcsinh"
      CD31: "arcsinh"
      CD7: "arcsinh"
      HLA_DR: "arcsinh"
      MUC1: "arcsinh"
      CollagenIV: "arcsinh"
      Synaptophysin: "arcsinh"
      CD45: "arcsinh"

    # threshold_mode (2026-08-19): "std_multiplier" (default, unchanged
    # from all prior runs -- mean_low + std_multiplier * std_low) or
    # "posterior" (GMM posterior probability of positive-component
    # membership >= confidence_level, using both components' full shape
    # instead of just the negative one's). Left at "std_multiplier" here
    # for the same reason transform is left at "none" -- worth
    # re-validating against real data before switching what feeds the
    # paper's accuracy number. See docs/spatia_analysis_cell_typing.md
    # for the full rationale and a synthetic-data comparison.
    threshold_mode: "std_multiplier"
    confidence_level: 0.8
    per_marker_confidence_overrides: {}

  clustering:
    n_neighbors: 15
    leiden_resolution: 0.5

  cell_type_definitions_file: "cell_type_definitions/crc_tma.yaml"
  cluster_labels_file: null

# ── Analysis steps (disabled for this config) ────────────────
analysis:
  triad:
    enabled: false
    radius_um: 30.0
    report_radius_um: 20.0
    trajectory_min_um: 8.0
    anchor_type:    "CD11c+ DCs"
    partner_type_1: "CD4+ T cells"
    partner_type_2: "CD8+ T cells"
    anchor_name:    "DC"
    partner_1_name: "CD4"
    partner_2_name: "CD8"
    matched_only: false
    min_triad_size: 1
  functional:
    enabled: false
    report_radius_um: 20.0
    markers: {}
  survival:
    enabled: false
    patient_annotation_file: ""
    area_per_image_um2: 1168128.0
    split_by: "median"
    censor_is_one: true
  tls:
    enabled: false
